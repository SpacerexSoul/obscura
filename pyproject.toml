[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "obscura"
version = "0.1.0a1"
description = "Pure-Python order-book replay + queue-position-aware backtester."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krishna Dattani" }]
keywords = ["quant", "trading", "backtest", "microstructure", "order-book", "itch"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
fast = ["numba>=0.60"]
dashboard = ["streamlit>=1.30"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[project.scripts]
obscura = "obscura.cli:main"

[project.urls]
Homepage = "https://github.com/spacerexsoul/obscura"
Repository = "https://github.com/spacerexsoul/obscura"

[tool.hatch.build.targets.wheel]
packages = ["src/obscura"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/obscura"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
